name: scrape
description: Extract web content, links and source discoveries with fail-closed provider presets. Preset drift is a classified failure, never generic page text.
socket:
  description: Local control for extraction, operator corpus, browser sessions and the isolated scrape-to-file queue.
mcp:
  description: Agent-facing bounded extraction, link and feed discovery, preset inspection and offline conversion. Excludes machine paths, live canaries and session administration.
  operations: [scrape_fetch, scrape_links, scrape_feed_discover, scrape_feed_parse, scrape_convert_html, scrape_presets_list, scrape_preset_show, scrape_canary_inventory, scrape_status]
websocket:
  description: Loopback read and extraction operations; operator filesystem and browser lifecycle remain on the socket.
  operations: [scrape_fetch, scrape_links, scrape_feed_discover, scrape_feed_parse, scrape_convert_html, scrape_presets_list, scrape_preset_show, scrape_canary_inventory, scrape_status]
