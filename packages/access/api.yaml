name: access
description: Shared Stack client pairing, one-use QR invitations, scoped device enrollment, grants, revocable credentials and audit. Device ingress requires verified direct tailnet traffic on every request.
socket:
  description: Same-user trusted approval, QR invitations, enrollment, inventory and revocation authority.
websocket:
  operations: all
  events: all
  description: Local System Access controls, exact expired-history retirement and invalidations. Audit has no manual prune.
http:
  description: Dedicated tailnet-only pairing, scoped Brain and Content ingress, and separately authenticated remote UI origin. No internal MCP forwarding.
