name: brain
description: Search local research and admit durable ingestion into an isolated Stack Brain index. Admission is asynchronous; the owned worker uses the Stack Scrape engine for URL extraction and source discovery.
socket:
  description: Unix socket for research, ingestion ledger, recurring sources, recovery and operator-only private-destination grants. Grant management is socket-only.
mcp:
  workerOperations: [stats, search, context, get, tags]
  operations: &public_operations
    - brain_status
    - jobs_reveal
    - stats
    - search
    - context
    - get
    - tags
    - submit
    - submission_completion
    - sources_sync_completion
    - delete
    - retag
    - jobs_list
    - jobs_show
    - jobs_run
    - jobs_stats
    - jobs_retry
    - jobs_cancel
    - jobs_exclude
    - sources_list
    - sources_show
    - sources_status
    - sources_apply
    - sources_sync
    - sources_pause
    - sources_resume
    - backup_create
    - backup_verify
    - recovery_import
    - recovery_online
    - recovery_execute
    - doctor
  events: [jobs_changed, sources_changed]
  description: Brain operations over internal stdio or external HTTP, with opt-in content-safe ingestion/discovery completion watches. Operator stdio supports standalone research retrieval; other calls and external HTTP require the Brain socket.
websocket:
  operations:
    - brain_state_read
    - brain_state_receipt_get
    - brain_jobs_plan
    - brain_jobs_clear
    - brain_runs_plan
    - brain_runs_clear
    - brain_source_plan
    - brain_source_clear
    - brain_artifacts_plan
    - brain_artifacts_clear
    - brain_status
    - jobs_reveal
    - stats
    - search
    - context
    - get
    - tags
    - submit
    - submission_completion
    - sources_sync_completion
    - delete
    - retag
    - jobs_list
    - jobs_show
    - jobs_run
    - jobs_stats
    - jobs_retry
    - jobs_cancel
    - jobs_exclude
    - sources_list
    - sources_show
    - sources_status
    - sources_apply
    - sources_sync
    - sources_pause
    - sources_resume
    - backup_create
    - backup_verify
    - recovery_import
    - recovery_online
    - recovery_execute
    - doctor
    - share_read_states
  events: all
  description: Loopback WebSocket operations forwarded to the Brain socket, with ledger, source and index change notices for the UI Brain space.
http:
  description: Authenticated versioned JSON routes for device shares on a separate listener; only the declared share operations are available.
