name: brain
description: Search local research and admit durable ingestion into an isolated AgentStack Brain index. Admission is asynchronous; the owned worker uses the AgentStack Scrape engine for URL extraction and source discovery.
socket:
  description: Unix socket for research, ingestion ledger, recurring sources and recovery operations.
mcp:
  operations: all
  events: []
  description: HTTP MCP operations forwarded to the Brain socket. Change notices are not offered to agents.
websocket:
  operations: all
  events: all
  description: Loopback WebSocket operations forwarded to the Brain socket, with ledger, source and index change notices for the UIX Brain space.
http:
  description: Authenticated versioned JSON routes for device shares on a separate listener; only the declared share operations are available.
