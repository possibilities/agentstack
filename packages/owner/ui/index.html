<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <main aria-label="Owned processes"></main>
    </div>
    <script>
      window.agentstackTree = (data) => [
        {
          kind: "manager",
          label: "owner",
          detail: data.pid ? `pid ${data.pid}` : "",
          activity: "working",
          children: (data.children ?? []).map((child) => ({
            kind: "native",
            label: child.name,
            detail: child.pid ? `pid ${child.pid}` : "",
            activity: "working",
          })),
        },
      ];
    </script>
    <script src="app.js"></script>
  </body>
</html>
