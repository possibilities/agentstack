name: worker
description: Run durable account-bound Workers through ACP or the native Claude Agent SDK in owned Git worktrees; inspect conversations, turns, tool/task evidence, session metadata and account runtime health.
socket:
  description: Private socket for Worker lifecycle, bounded structured history, account catalog and runtime operations.
mcp:
  workerOperations: [worker_list, worker_status, worker_read, worker_detail, worker_turn_list, worker_record_list, worker_record_read, worker_tool_list, worker_diff, worker_turn_context]
  operations: all
  events: all
  description: Bot-facing Worker operations and account-bound catalog, forwarded to the worker socket.
websocket:
  operations: all
  events: all
  description: Loopback WebSocket for Worker reads, operations and change notices.
