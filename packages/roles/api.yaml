name: roles
description: Manage the single role's instruction fragments, skills, additional MCP servers, and explicit trusted projects for new bot launches.
socket:
  description: Unix socket for role operations and change events.
mcp:
  description: HTTP MCP operations for role editing, forwarded to the roles socket.
websocket:
  description: Loopback WebSocket for role operations and change events, forwarded to the roles socket.
