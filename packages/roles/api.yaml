name: roles
description: Manage named Roles and their instructions, skills, MCP servers and trusted projects. Bots and Workers have independent launch defaults.
socket:
  description: Unix socket for role operations and change events.
mcp:
  workerOperations: [roles_snapshot, role_snapshot, role_preview, role_internal_mcp_list]
  operations:
    - roles_snapshot
    - role_create
    - role_update
    - role_set_default
    - role_set_worker_default
    - role_delete
    - role_internal_mcp_list
    - role_internal_mcp_update
    - role_snapshot
    - role_preview
    - category_create
    - category_update
    - category_delete
    - category_reorder
    - fragment_create
    - fragment_update
    - fragment_delete
    - fragment_reorder
    - fragment_move
    - skill_create
    - skill_update
    - skill_delete
    - skill_reorder
    - mcp_server_create
    - mcp_server_update
    - mcp_server_delete
    - mcp_server_reorder
    - project_create
    - project_update
    - project_delete
    - project_reorder
  events: all
  description: Role operations over internal stdio or external HTTP. Operator stdio supports standalone stored Role reads; editing and external HTTP require the roles socket.
websocket:
  operations:
    - roles_state_read
    - role_launch_list
    - role_launch_plan
    - role_launch_clear
    - roles_state_receipt_get
    - roles_snapshot
    - role_shim_list
    - role_shim_create
    - role_shim_update
    - role_shim_delete
    - role_create
    - role_update
    - role_set_default
    - role_set_worker_default
    - role_delete
    - role_internal_mcp_list
    - role_internal_mcp_update
    - role_snapshot
    - role_editor_snapshot
    - role_preview
    - role_launch_preview
    - category_create
    - category_update
    - category_delete
    - category_reorder
    - fragment_create
    - fragment_update
    - fragment_delete
    - fragment_reorder
    - fragment_move
    - skill_create
    - skill_update
    - skill_delete
    - skill_reorder
    - mcp_server_create
    - mcp_server_update
    - mcp_server_delete
    - mcp_server_reorder
    - project_create
    - project_update
    - project_delete
    - project_reorder
  events: all
  description: Loopback WebSocket for role operations and change events, forwarded to the roles socket.
