name: browse
description: Durable Bot browser profiles, supervised Kernel runtimes, controller binding and local toolchain management. Page actions remain in agent-browser.
socket:
  description: Owner-local provider lifecycle, constrained disposable research browsers and system management; not an agent-facing browser transport.
mcp:
  workerOperations: []
  events: [browser_handoffs_changed]
  description: Verified live Bots manage only their own profiles and current-launch controllers. Page actions remain in agent-browser.
  operations:
    - browser_profile_list
    - browser_profile_create
    - browser_profile_delete
    - browser_controller_list
    - browser_controller_select
    - browser_handoff_request
    - browser_handoff_get
    - browser_handoff_list
    - browser_handoff_completion
    - browser_handoff_cancel
websocket:
  events: all
  description: Loopback management operations and change notices for future operator clients.
  operations:
    - browse_state_read
    - browser_profile_reset_plan
    - browser_profile_reset_clear
    - browser_site_data_plan
    - browser_site_data_clear
    - browser_handoff_history_plan
    - browser_handoff_history_clear
    - browser_volume_list
    - browser_volume_plan
    - browser_volume_clear
    - browse_state_receipt_get
    - browse_state_fence_release
    - browser_handoff_get
    - browser_handoff_list
    - browser_handoff_completion
    - browser_handoff_take
    - browser_handoff_finish
    - browser_status
    - browser_profile_list
    - browser_profile_create
    - browser_profile_delete
    - browser_controller_list
    - browser_controller_select
    - agent_browser_status
    - agent_browser_detect
    - agent_browser_check_updates
    - agent_browser_update_policy_set
    - agent_browser_install
    - agent_browser_update_accept
    - agent_browser_uninstall
    - hypeman_detect
    - hypeman_location_set
    - hypeman_enable
    - hypeman_install
    - hypeman_uninstall
