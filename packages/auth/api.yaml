name: auth
description: Manage independent Codex Bot sign-ins and Codex, Grok, Devin and Claude Worker sign-ins without exposing credentials.
socket:
  description: Unix socket for account and sign-in operations, namespaced as auth.
mcp:
  workerOperations: []
  operations: [account_list, account_set_enabled, account_remove, account_login_start, account_login_replace, account_login_status, account_login_current, account_login_cancel, worker_account_list, worker_account_prepare, worker_account_confirm, worker_account_set_enabled, worker_account_remove, worker_account_login_start, worker_account_login_status, worker_account_login_current, worker_account_login_submit, worker_account_login_cancel]
  events: all
  description: MCP tools for account and sign-in operations, forwarded to the auth socket over internal stdio or external HTTP.
websocket:
  operations: all
  events: all
  description: Loopback WebSocket for account operations and change events, forwarded to the auth socket.
