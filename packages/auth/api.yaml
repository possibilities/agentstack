name: auth
description: Manage independent Codex Bot sign-ins and Codex, Grok and Devin Worker sign-ins without exposing credentials.
socket:
  description: Unix socket for account and sign-in operations, namespaced as auth.
mcp:
  description: HTTP MCP tools for account and sign-in operations, forwarded to the auth socket.
websocket:
  description: Loopback WebSocket for account operations and change events, forwarded to the auth socket.
