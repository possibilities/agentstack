name: notify
description: Durable internal notifications with stable IDs, group replacement, click-through, action and reply prompts, one dismissal with its outcome, filtered history and counts, and change notices. No presentation or callbacks.
socket:
  description: Local notification creation, dismissal, and history.
mcp:
  workerOperations: []
  operations: [notification_send, notification_get, notification_list, notification_counts, notification_dismiss, notification_dismiss_all]
  events: all
  description: Agent-facing notification creation and history over the owner's loopback MCP listener.
websocket:
  operations: all
  events: all
  description: Loopback notification API and payload-free invalidation notices for future clients.
