name: github
description: Signed GitHub webhook intake, lossless durable delivery records, exhaustive event/payload discovery and filtered watch inboxes delivered through Stack subscriptions. Local operator APIs guide and reconcile GitHub setup.
socket:
  description: Full local GitHub control, webhook setup, delivery reads, watches and owner maintenance. Receiver secrets and remote hook changes require local operator authority.
mcp:
  workerOperations: []
  operations: [github_status, github_event_catalog, github_event_schema, github_endpoint_list, github_endpoint_get, github_setup_read, github_delivery_list, github_delivery_get, github_delivery_payload, github_watch_create, github_watch_list, github_watch_get, github_watch_read, github_watch_update, github_watch_acknowledge, github_watch_remove]
  events: all
  description: Agent discovery, durable delivery reads and filtered watch inboxes. Existing Stack events_subscribe drives scoped Bot snapshots; receiver credentials and remote setup remain local operator controls.
websocket:
  operations: all
  events: all
  description: Local UI-ready setup, delivery, watch and maintenance API through the shared WebSocket. No GitHub UI is introduced by this package; setup credentials and remote mutations are local-only.
http:
  description: Separate loopback webhook intake with per-receiver HMAC-SHA256, raw-body limits and durable duplicate detection. Explicit public HTTPS proxying of only the webhook path is required for GitHub Cloud delivery.
