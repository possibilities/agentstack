name: bots
description: Own Codex Bots and their sanctioned chats. Search history, page turns and items, follow bounded live main-thread items, and send, steer or queue messages. Only a Bot's main thread and descendants are visible; ACP Workers are excluded. Notices are invalidations, not transcript content; approvals still require a native Codex client.
socket:
  description: Unix socket for bot lifecycle, chat search, bounded transcript history and live observation, live turn controls, durable queue, scoped change notices, and voice calls.
mcp:
  description: HTTP MCP operations for Bots and chats, forwarded to the bots socket.
websocket:
  description: Loopback WebSocket for Bot and chat operations, with scoped chat and queue invalidations forwarded to the bots socket.
