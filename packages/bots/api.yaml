name: bots
description: Start, stop, and list numbered Codex bot app-servers, each in its own private workspace with a main thread resumed on startup. Subscribe to change events for one bot ID.
socket:
  description: Unix socket for Codex bot lifecycle and bot-scoped change events, namespaced as bots.
mcp:
  description: HTTP MCP tools for Codex bot lifecycle, forwarded to the bots socket.
