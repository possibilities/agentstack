name: bots
description: Own Codex Bots and their sanctioned chats. Search history, browse paged turns and items, send and steer live turns, interrupt, stage files, and queue messages. Only a Bot's main thread and descendants are visible; ACP Workers are excluded. For token deltas and approval responses, a live UI connects to the Bot's app-server endpoint; Package API notices are invalidations.
socket:
  description: Unix socket for bot lifecycle, chat search, transcript reading, live turn controls, durable queue, scoped change notices, and voice calls.
mcp:
  description: HTTP MCP operations for Bots and chats, forwarded to the bots socket.
websocket:
  description: Loopback WebSocket for Bot and chat operations, with scoped chat and queue invalidations forwarded to the bots socket.
