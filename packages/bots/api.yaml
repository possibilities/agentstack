name: bots
description: Own Codex Bots, sanctioned chats and a single voice call. Inspect nested subagent trees, model/effort and creation evidence; search history, page or follow items, send, steer or queue messages, and submit speech. Only the main thread and descendants are visible; ACP Workers are separate. Notices invalidate reads; approvals require a native Codex client.
socket:
  description: Unix socket for bot lifecycle, chat search, bounded transcript history and live observation, live turn controls, durable queue, scoped change notices, voice calls and speech submission.
mcp:
  workerOperations: []
  operations: [bot_settings_catalog, bot_settings_read, bot_settings_preview, bot_settings_patch, bot_settings_apply, bot_settings_options, bot_settings_native_schema, bot_start, bot_stop, bot_assign, bot_remove, bot_list, bot_defaults_get, bot_defaults_set, voice_status, voice_dial, voice_speak, voice_hangup, chat_list, chat_tree, chat_tree_detail, chat_search, chat_records, chat_record_chunk, chat_message_changes, chat_thread_read, chat_turns, chat_items, chat_main_live, chat_main_items, chat_occurrences, chat_open, chat_send, chat_steer, chat_interrupt, chat_enqueue, chat_queue_list, chat_queue_resolve, chat_codex_queue_add, chat_codex_queue_list, chat_codex_queue_update, chat_codex_queue_delete, chat_codex_queue_reorder, chat_codex_queue_start, chat_upload_start, chat_upload_status, chat_upload_chunk, chat_upload_finish, chat_attachment_add, chat_attachment_list, chat_attachment_remove]
  events: [bots_changed, threads_changed, voice_changed, defaults_changed, chats_changed, chat_live_changed, chat_queue_changed]
  description: HTTP MCP operations for Bots, chats and voice speech, forwarded to the bots socket.
websocket:
  operations: [bot_settings_catalog, bot_settings_read, bot_settings_preview, bot_settings_patch, bot_settings_apply, bot_settings_options, bot_settings_native_schema, bot_start, bot_stop, bot_assign, bot_remove, bot_list, bot_defaults_get, bot_defaults_set, voice_status, voice_dial, voice_speak, voice_hangup, chat_list, chat_tree, chat_tree_detail, chat_search, chat_records, chat_record_chunk, chat_message_changes, chat_thread_read, chat_turns, chat_items, chat_main_live, chat_main_items, chat_occurrences, chat_open, chat_send, chat_steer, chat_interrupt, chat_enqueue, chat_queue_list, chat_queue_resolve, chat_codex_queue_add, chat_codex_queue_list, chat_codex_queue_update, chat_codex_queue_delete, chat_codex_queue_reorder, chat_codex_queue_start, chat_upload_start, chat_upload_status, chat_upload_chunk, chat_upload_finish, chat_attachment_add, chat_attachment_list, chat_attachment_remove, bots_state_read, bot_state_read, bot_state_plan, bot_state_receipt_get, bot_state_fence_release, bot_workspace_list, bot_workspace_read, bot_workspace_clear, bot_session_reset, bot_history_list, bot_history_clear, bot_queue_history, bot_launch_read, bot_launch_args_clear, bot_log_read, bot_log_clear, bot_recovery_list, bot_recovery_discard, bot_upload_remove, chat_upload_list, chat_upload_read]
  events: all
  description: Loopback WebSocket for Bot, chat and voice operations, with scoped chat and queue invalidations forwarded to the bots socket.
